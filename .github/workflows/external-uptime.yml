name: External uptime
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check production or run a clearly labelled alert exercise
        required: true
        default: check
        type: choice
        options: [check, drill]
permissions:
  contents: write
concurrency:
  group: external-uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check website and inventory independently
        run: node monitor/run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_ALERT_RECIPIENTS: ${{ secrets.OPS_ALERT_RECIPIENTS }}
          EMAIL_FROM_NOREPLY: ${{ secrets.EMAIL_FROM_NOREPLY }}
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
